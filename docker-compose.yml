services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MOVIES_PATH}:/media/movies:ro
